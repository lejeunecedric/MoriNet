[package]
name = "morinet"
version = "0.1.0"
edition = "2021"
description = "mdBook server that exposes an Obsidian second brain with auth, WebDAV and MCP"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lejeunecedric/MoriNet"
readme = "README.md"
keywords = ["mdbook", "obsidian", "second-brain", "wiki", "mcp"]
categories = ["command-line-utilities", "web-servers"]

[lib]
name = "morinet"
path = "src/lib.rs"

[[bin]]
name = "morinet"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
hmac = "0.12"
sha2 = "0.10"
subtle = "2.6"
base64 = "0.22"

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
