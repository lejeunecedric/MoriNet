[package]
name = "morinet"
version = "0.1.0"
edition = "2021"
description = "Serveur mdbook pour second brain Obsidian avec auth, WebDAV et MCP"
license = "MIT OR Apache-2.0"
repository = "https://github.com/lejeunecedric/MoriNet"
readme = "README.md"
keywords = ["mdbook", "obsidian", "second-brain", "wiki", "mcp"]
categories = ["command-line-utilities", "web-servers"]

[lib]
name = "morinet"
path = "src/lib.rs"

[[bin]]
name = "morinet"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
pretty_assertions = "1.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
