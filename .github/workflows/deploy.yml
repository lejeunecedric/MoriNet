name: Deploy

# Deploys each published release to the holldemo test server (morinet.treklair.fr).
# Phase 0: installs the binary and smoke-checks `morinet --version` over SSH.
# Phase 1+: will also restart the `morinet` systemd service and hit /health.

on:
  release:
    types: [published]
  # Fallback: the release:published event proved flaky on this repo (v0.1.1 was
  # never auto-triggered), so also fire on version tag pushes.
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to deploy (default: latest published release)'
        required: false
        type: string

concurrency:
  group: deploy-holldemo
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy to holldemo
    runs-on: ubuntu-latest
    env:
      TARGET: x86_64-unknown-linux-gnu
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      # `secrets` is not a valid named-value in a step-level `if:` (GitHub
      # rejects the workflow at parse time with HTTP 422). Env vars are.
      # A published release must always land on the server: a missing secret
      # must fail loudly, never skip into a green no-op run.
      - name: Verify deploy secrets are configured
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          missing=""
          [ -n "$DEPLOY_HOST" ] || missing="$missing DEPLOY_HOST"
          [ -n "$DEPLOY_USER" ] || missing="$missing DEPLOY_USER"
          [ -n "$DEPLOY_SSH_KEY" ] || missing="$missing DEPLOY_SSH_KEY"
          if [ -n "$missing" ]; then
            echo "::error::Missing deploy secrets:$missing"
            exit 1
          fi

      # github.event.release.tag_name is null on workflow_dispatch, so fall
      # back to the dispatch input, then to the latest published release.
      - name: Resolve release tag
        id: tag
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${{ github.event.release.tag_name }}"
          fi
          if [ -z "$TAG" ]; then
            TAG=$(gh release view --repo "$REPO" --json tagName -q .tagName)
            echo "No tag supplied or released: falling back to latest release ${TAG}"
          fi
          if [ -z "$TAG" ]; then
            echo "::error::Could not resolve a release tag to deploy."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Download and verify release binary
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          BASE="https://github.com/${REPO}/releases/download/${TAG}"
          echo "Deploying ${TAG} from ${BASE}"
          # The .sha256 file references the original asset name, so download
          # under that exact name -- renaming it makes `sha256sum -c` fail.
          # cargo-dist tarballs wrap everything in a target-named directory,
          # hence --strip-components=1 to land the binary at ./morinet.
          ASSET="morinet-${TARGET}.tar.xz"
          curl -fsSL -o "$ASSET" "${BASE}/${ASSET}"
          curl -fsSL -o "${ASSET}.sha256" "${BASE}/${ASSET}.sha256"
          sha256sum -c "${ASSET}.sha256"
          tar xJf "$ASSET" --strip-components=1
          ./morinet --version

      - name: Upload binary to holldemo (staging)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "morinet"
          # Staging dir, NOT /opt/morinet/bin/ — overwriting the running binary
          # fails with ETXTBSY ("Text file busy"). The mv below is atomic.
          target: "/opt/morinet/staging/"
          overwrite: true

      - name: Swap binary + restart service + smoke check over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          # Requires a sudoers entry on holldemo (vops):
          #   <deploy-user> ALL=(root) NOPASSWD: /usr/bin/systemctl restart morinet
          script: |
            mv -f /opt/morinet/staging/morinet /opt/morinet/bin/morinet
            chmod +x /opt/morinet/bin/morinet
            /opt/morinet/bin/morinet --version
            if sudo -n systemctl restart morinet 2>/dev/null; then
              echo "service restarted"
            else
              echo "::warning::could not restart morinet (sudoers entry missing?); binary updated on disk, service still on previous build"
            fi
            sleep 2
            curl -fsS http://localhost:8080/health || echo "::warning::/health not reachable (service not running?)"
